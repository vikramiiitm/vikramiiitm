<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-label="System architecture visualization">
<defs>
  <linearGradient id="bg" x1="0" x2="1"><stop stop-color="#080b12"/><stop offset="1" stop-color="#101827"/></linearGradient>
  <linearGradient id="line" x1="0" x2="1"><stop stop-color="#22d3ee"/><stop offset=".55" stop-color="#8b5cf6"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>
    .wire{stroke:url(#line);stroke-width:2;fill:none;stroke-dasharray:8 12;animation:flow 5s linear infinite}
    .node{fill:#0c1320;stroke:#334155;stroke-width:1.5;animation:pulse 3s ease-in-out infinite}
    .hot{stroke:#22d3ee;filter:url(#glow)}
    @keyframes flow{to{stroke-dashoffset:-80}}
    @keyframes pulse{0%,100%{opacity:.72}50%{opacity:1;stroke:#64748b}}
  </style>
</defs>
<rect width="1200" height="330" rx="20" fill="url(#bg)"/>
<g opacity=".12" stroke="#94a3b8"><path d="M40 55H1160M40 110H1160M40 165H1160M40 220H1160M40 275H1160"/><path d="M120 25V305M240 25V305M360 25V305M480 25V305M600 25V305M720 25V305M840 25V305M960 25V305M1080 25V305"/></g>
<text x="48" y="48" fill="#e2e8f0" font-family="ui-monospace,monospace" font-size="15" letter-spacing="3">SYSTEMS / ARCHITECTURE</text>
<g font-family="ui-monospace,monospace" text-anchor="middle">
 <rect class="node" x="55" y="135" width="150" height="70" rx="14"/><text x="130" y="165" fill="#f8fafc" font-size="16">CLIENTS</text><text x="130" y="187" fill="#64748b" font-size="11">web · mobile · api</text>
 <rect class="node hot" x="275" y="105" width="175" height="130" rx="16"/><text x="362" y="148" fill="#f8fafc" font-size="16">SERVICES</text><text x="362" y="171" fill="#94a3b8" font-size="11">auth · domain · jobs</text><text x="362" y="190" fill="#94a3b8" font-size="11">REST · GraphQL</text>
 <rect class="node" x="520" y="55" width="160" height="75" rx="14"/><text x="600" y="87" fill="#f8fafc" font-size="15">QUEUE</text><text x="600" y="108" fill="#64748b" font-size="11">events · retries</text>
 <rect class="node" x="520" y="200" width="160" height="75" rx="14"/><text x="600" y="232" fill="#f8fafc" font-size="15">WORKERS</text><text x="600" y="253" fill="#64748b" font-size="11">async · ETL · tasks</text>
 <rect class="node" x="755" y="105" width="175" height="130" rx="16"/><text x="842" y="148" fill="#f8fafc" font-size="16">DATA</text><text x="842" y="171" fill="#94a3b8" font-size="11">PostgreSQL · MongoDB</text><text x="842" y="190" fill="#94a3b8" font-size="11">warehouse · storage</text>
 <rect class="node" x="1000" y="135" width="145" height="70" rx="14"/><text x="1072" y="165" fill="#f8fafc" font-size="15">SYSTEMS</text><text x="1072" y="187" fill="#64748b" font-size="11">webhooks · SFTP</text>
</g>
<path class="wire" d="M205 170H275"/><path class="wire" d="M450 145C480 120 490 95 520 95"/><path class="wire" d="M450 195C480 220 490 237 520 237"/><path class="wire" d="M680 95C715 95 720 145 755 145"/><path class="wire" d="M680 237C715 237 720 195 755 195"/><path class="wire" d="M930 170H1000"/>
</svg>