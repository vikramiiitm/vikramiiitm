<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="EONOM and BLESSHMS product systems">
<defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#080b12"/><stop offset="1" stop-color="#111827"/></linearGradient><linearGradient id="e" x1="0" x2="1"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#3b82f6"/></linearGradient><linearGradient id="b" x1="0" x2="1"><stop stop-color="#a5b3a6"/><stop offset="1" stop-color="#5a6b5d"/></linearGradient><style>.beam{stroke:url(#e);stroke-width:2;stroke-dasharray:5 13;animation:f 4s linear infinite}.beam2{stroke:url(#b);stroke-width:2;stroke-dasharray:5 13;animation:f 4s linear infinite;animation-delay:-1.5s}@keyframes f{to{stroke-dashoffset:-72}}.card{fill:#0c1320;stroke:#334155}</style></defs>
