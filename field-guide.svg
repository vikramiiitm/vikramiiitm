<path d="M58 315H585" class="fine"/><text x="58" y="340" class="label ink">THE WORK</text><text x="58" y="371" class="serif" style="font-size:24px" fill="#171716">Build it. Understand it. Make it hold.</text><text x="58" y="399" class="note muted">backend systems · data · infrastructure · products</text>
<g transform="translate(730 405)"><text x="0" y="0" class="label ink">BUILD</text><text x="92" y="0" class="label muted">/</text><text x="115" y="0" class="label ink">BREAK</text><text x="216" y="0" class="label muted">/</text><text x="240" y="0" class="label ink">UNDERSTAND</text></g>
<text x="58" y="494" class="note muted">FIELD GUIDE / INDIA</text><text x="1145" y="494" text-anchor="end" class="note muted">1200 × 520</text>
