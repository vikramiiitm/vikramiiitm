<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<defs>
<title id="title">Vikram, an engineer's field notes</title>
<desc id="desc">An editorial field guide cover about building systems, products and experiments.</desc>
<style>
.ink{fill:#171716}.muted{fill:#6d6962}.paper{fill:#f4f0e8}.line{stroke:#252421;stroke-width:2;fill:none}.fine{stroke:#aaa49a;stroke-width:1;fill:none}.accentFill{fill:#a94738}
.display{font:700 76px Georgia,'Times New Roman',serif;letter-spacing:-3px}.label{font:700 12px Inter,'Helvetica Neue',Arial,sans-serif;letter-spacing:3px}.note{font:12px 'SFMono-Regular',Consolas,'Liberation Mono',monospace;letter-spacing:1px}.serif{font-family:Georgia,'Times New Roman',serif}
@keyframes draw{from{stroke-dashoffset:1100}to{stroke-dashoffset:0}}@keyframes float{from{transform:translate(0,0)}to{transform:translate(7px,-5px)}}@keyframes reveal{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.trace{stroke-dasharray:1100;animation:draw 3.8s cubic-bezier(.2,.8,.2,1) forwards}.marker{animation:float 3.5s ease-in-out infinite alternate}.reveal{animation:reveal 1s cubic-bezier(.2,.8,.2,1) both}
</style>
<pattern id="paperDots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".7" fill="#aaa49a" opacity=".22"/></pattern>
</defs>
<rect width="1200" height="520" class="paper"/><rect width="1200" height="520" fill="url(#paperDots)"/>
