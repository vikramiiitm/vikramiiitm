<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520"><defs><style>.ink{fill:#171717}.muted{fill:#777}.line{stroke:#171717;stroke-width:2;fill:none}.fine{stroke:#aaa;stroke-width:1;fill:none}.accent{stroke:#d64b32;stroke-width:3;fill:none}.note{font:12px monospace;letter-spacing:1px}.title{font:700 58px Georgia,serif}.label{font:700 13px monospace;letter-spacing:3px}@keyframes drift{from{transform:translateX(0)}to{transform:translateX(18px)}}@keyframes draw{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}.trace{stroke-dasharray:900;animation:draw 4s cubic-bezier(.2,.8,.2,1) forwards}.mark{animation:drift 3s ease-in-out infinite alternate}</style></defs><rect width="1200" height="520" fill="#f4f0e8"/><path d="M52 54H1148M52 466H1148" class="fine"/><text x="55" y="42" class="label ink">FIELD GUIDE / 01</text><text x="1145" y="42" text-anchor="end" class="note muted">VIKRAMIIITM</text><text x="58" y="155" class="title ink">An engineer's</text><text x="58" y="220" class="title ink">field notes.</text><text x="60" y="260" class="note muted">systems · products · experiments · things that broke</text><g transform="translate(680 90)"><path d="M0 250C70 190 100 80 210 100S360 270 470 210" class="line trace"/><path d="M0 300C110 350 160 190 280 250S380 360 470 300" class="fine"/><circle cx="0" cy="250" r="8" class="ink"/><circle cx="210" cy="100" r="8" fill="#d64b32"/><circle cx="470" cy="210" r="8" class="ink"/><path d="M210 100v-58M210 42h110" class="fine"/><text x="328" y="47" class="note muted">observe</text><g class="mark"><path d="M300 250l34 -18v36z" fill="#d64b32"/></g></g><text x="58" y="420" class="label ink">01</text><text x="100" y="420" class="note ink">BUILD SOMETHING REAL</text><text x="360" y="420" class="label ink">02</text><text x="402" y="420" class="note ink">FIND WHERE IT BREAKS</text><text x="700" y="420" class="label ink">03</text><text x="742" y="420" class="note ink">KEEP THE INTERESTING PART</text><text x="58" y="495" class="note muted">T