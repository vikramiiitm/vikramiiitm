    <circle cx="1111" cy="258" r="5" fill="#B66A4A"/>
  </g>

  <g fill="none" stroke-linecap="round">
    <path d="M1018 598 C984 581 956 578 926 589 C900 598 878 610 850 620" stroke="#3C4C39" stroke-width="5"/>
    <path d="M1020 603 C1048 585 1072 578 1098 582 C1122 586 1143 599 1160 620" stroke="#3C4C39" stroke-width="5"/>
