<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Vikram, software engineer building living systems</title>
  <desc id="desc">A warm botanical composition with the name Vikram, software engineer, and subtle references to systems, growth and engineering.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F6F1E7"/>
      <stop offset="1" stop-color="#EEE7D9"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-opacity="0.12"/>
    </filter>
    <style>
      .serif{font-family:Georgia,'Times New Roman',serif}
      .sans{font-family:Arial,Helvetica,sans-serif}
      .mono{font-family:'Courier New',monospace}
      .grow{stroke-dasharray:720;stroke-dashoffset:720;animation:draw 4s cubic-bezier(.22,.61,.36,1) forwards}
      .leaf{transform-box:fill-box;transform-origin:center;animation:breathe 6s ease-in-out infinite}
      .leaf2{animation-delay:-2s}
      .leaf3{animation-delay:-4s}
      @keyframes draw{to{stroke-dashoffset:0}}
      @keyframes breathe{0%,100%{transform:rotate(-1deg) scale(1)}50%{transform:rotate(2deg) scale(1.025)}}
      @media(prefers-reduced-motion:reduce){.grow{animation:none;stroke-dashoffset:0}.leaf,.leaf2,.leaf3{animation:none}}
    </style>
  </defs>

  <rect width="1200" height="620" fill="url(#paper)"/>

  <!-- sunlight, kept deliberately soft -->
  <circle cx="1030" cy="92" r="125" fill="#D8B56A" opacity=".10" filter="url(#soft)"/>

  <!-- quiet editorial registration marks -->
  <g fill="#6E7168" opacity=".55">
    <circle cx="72" cy="74" r="3"/>
    <circle cx="1118" cy="548" r="3"/>
  </g>
  <path d="M72 74h72M72 74v72M1128 548h-72M1128 548v-72" stroke="#77776F" stroke-width="1" opacity=".35"/>

  <!-- botanical form: the same stem will later continue into section 2 -->
  <g filter="url(#shadow)">
    <path class="grow" d="M1038 620 C1014 552 1036 507 1008 456 C977 399 926 383 936 317 C946 258 1000 220 1009 157 C1017 103 993 63 961 27" fill="none" stroke="#294936" stroke-width="7" stroke-linecap="round"/>
    <path d="M1011 459 C963 438 929 438 896 409" fill="none" stroke="#294936" stroke-width="4" stroke-linecap="round" opacity=".9"/>
    <path d="M938 319 C976 299 1000 274 1013 241" fill="none" stroke="#294936" stroke-width="4" stroke-linecap="round" opacity=".9"/>

    <g class="leaf">
      <path d="M898 409 C861 371 857 337 882 321 C915 323 928 350 898 409Z" fill="#70856A"/>
      <path d="M897 402 C886 378 881 352 882 329" fill="none" stroke="#294936" stroke-width="2" opacity=".65"/>
    </g>
    <g class="leaf leaf2">
      <path d="M1008 244 C1028 199 1062 182 1086 201 C1082 235 1051 251 1008 244Z" fill="#54725B"/>
      <path d="M1015 239 C1040 222 1060 211 1080 205" fill="none" stroke="#294936" stroke-width="2" opacity=".65"/>
    </g>
    <g class="leaf leaf3">
      <path d="M966 28 C935 0 935 -28 960 -40 C992 -29 1000 -2 966 28Z" fill="#7E9275"/>
    </g>
  </g>

  <!-- main identity -->
  <text x="92" y="132" class="mono" font-size="13" letter-spacing="3" fill="#6E7168">01 / IDENTITY</text>

  <text x="88" y="292" class="serif" font-size="122" letter-spacing="-5" fill="#1D211B">Vikram</text>
  <path d="M94 316 C245 323 400 315 532 319" fill="none" stroke="#B66A4A" stroke-width="3"/>

  <text x="96" y="372" class="sans" font-size="25" font-weight="600" letter-spacing="1" fill="#1D211B">Software Engineer</text>
  <text x="96" y="405" class="sans" font-size="19" fill="#5F625A">backend &amp; distributed systems</text>

  <text x="96" y="478" class="serif" font-size="28" fill="#294936">I build systems that have to work.</text>
  <text x="98" y="509" class="sans" font-size="16" fill="#6E7168">4+ years across production systems, data, integrations and infrastructure.</text>

  <!-- tiny technical annotation, human-scale rather than dashboard-like -->
  <g class="mono" fill="#6E7168" font-size="11" letter-spacing="1.4">
    <text x="94" y="553">BANGALORE · IIITM GWALIOR · 2021 → NOW</text>
    <text x="1037" y="580" transform="rotate(-90 1037 580)">GROWTH / SYSTEMS / CRAFT</text>
  </g>

  <!-- transition seed: intentionally touches the lower edge so section 2 can continue it -->
  <circle cx="1038" cy="616" r="11" fill="#B66A4A" opacity=".9"/>
  <path d="M1038 605 C1048 590 1058 582 1071 575" fill="none" stroke="#B66A4A" stroke-width="2" opacity=".8"/>
</svg>
