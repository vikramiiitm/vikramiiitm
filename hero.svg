<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070b"/>
      <stop offset="0.48" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#05070b"/>
    </linearGradient>
    <radialGradient id="halo" cx="72%" cy="48%" r="48%">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.14"/>
      <stop offset="0.42" stop-color="#7c3aed" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#22d3ee" stop-opacity="0.9"/>
      <stop offset="0.52" stop-color="#a78bfa" stop-opacity="1"/>
      <stop offset="0.8" stop-color="#22d3ee" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <filter id="glowCyan" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowSoft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.8" fill="#94a3b8" opacity="0.22"/>
    </pattern>
    <style>
      .grid {
        animation-duration: 16s;
        animation-iteration-count: infinite;
        animation-fill-mode: forwards;
        animation-timing-function: ease-in-out;
        animation-name: driftGrid;
      }
      .signal {
        stroke-dasharray: 12 28;
        animation-duration: 3.2s;
        animation-iteration-count: infinite;
        animation-fill-mode: forwards;
        animation-timing-function: linear;
        animation-name: signalFlow;
      }
      .signal2 {
        stroke-dasharray: 4 34;
        animation-duration: 5s;
        animation-iteration-count: infinite;
        animation-fill-mode: forwards;
        animation-timing-function: linear;
        animation-name: signalFlowReverse;
      }
      .pulse {
        animation-duration: 2.6s;
        animation-iteration-count: infinite;
        animation-fill-mode: forwards;
        animation-timing-function: ease-in-out;
        animation-name: breathe;
      }
      .pulse2 { animation-delay: 0.65s; }
      .pulse3 { animation-delay: 1.25s; }
      .orbit {
        transform-origin: 890px 210px;
        animation-duration: 18s;
        animation-iteration-count: infinite;
        animation-timing-function: linear;
        animation-name: rotate;
      }
      .orbit2 {
        transform-origin: 890px 210px;
        animation-duration: 27s;
        animation-iteration-count: infinite;
        animation-timing-function: linear;
        animation-direction: reverse;
        animation-name: rotate;
      }
      .scanner {
        animation-duration: 5s;
        animation-iteration-count: infinite;
        animation-timing-function: ease-in-out;
        animation-name: scan;
      }
      .typing {
        animation-duration: 4s;
        animation-iteration-count: infinite;
        animation-timing-function: steps(1);
        animation-name: blink;
      }
      @keyframes driftGrid {
        0%, 15% { transform: translate(0, 0); opacity: 0.3; }
        55% { transform: translate(-18px, 10px); opacity: 0.5; }
        100% { transform: translate(0, 0); opacity: 0.3; }
      }
      @keyframes signalFlow {
        0% { stroke-dashoffset: 0; opacity: 0.2; }
        50% { opacity: 0.9; }
        100% { stroke-dashoffset: -160; opacity: 0.2; }
      }
      @keyframes signalFlowReverse {
        0% { stroke-dashoffset: 0; opacity: 0.12; }
        50% { opacity: 0.65; }
        100% { stroke-dashoffset: 160; opacity: 0.12; }
      }
      @keyframes breathe {
        0%, 100% { transform: scale(0.72); opacity: 0.35; }
        50% { transform: scale(1.55); opacity: 1; }
      }
      @keyframes rotate {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes scan {
        0%, 100% { transform: translateY(-76px); opacity: 0; }
        15%, 75% { opacity: 0.8; }
        50% { transform: translateY(76px); opacity: 0.45; }
      }
      @keyframes blink {
        0%, 46%, 54%, 100% { opacity: 1; }
        50% { opacity: 0.15; }
      }
    </style>
  </defs>

  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="28" fill="url(#halo)"/>
  <rect x="24" y="24" width="1152" height="372" rx="20" fill="url(#dots)" opacity="0.45"/>

  <g class="grid" fill="none" stroke="#64748b" stroke-width="1" opacity="0.28">
    <path d="M40 74H1160M40 134H1160M40 194H1160M40 254H1160M40 314H1160M40 374H1160"/>
    <path d="M100 40V380M180 40V380M260 40V380M340 40V380M420 40V380M500 40V380M580 40V380M660 40V380M740 40V380M820 40V380M900 40V380M980 40V380M1060 40V380"/>
  </g>

  <g opacity="0.8">
    <path d="M60 344 C210 280 290 365 410 300 S610 240 760 286 S1000 350 1140 250" fill="none" stroke="#22d3ee" stroke-opacity="0.08" stroke-width="28" filter="url(#glowSoft)"/>
    <path class="signal" d="M60 344 C210 280 290 365 410 300 S610 240 760 286 S1000 350 1140 250" fill="none" stroke="url(#signal)" stroke-width="2.2"/>
    <path class="signal2" d="M60 356 C230 305 315 355 430 318 S640 270 790 305 S1010 330 1140 274" fill="none" stroke="#a78bfa" stroke-opacity="0.45" stroke-width="1.2"/>
  </g>

  <g>
    <text x="70" y="82" fill="#64748b" font-family="monospace" font-size="13" letter-spacing="4">VIKRAMIIITM // SYSTEM ONLINE</text>
    <circle cx="1090" cy="78" r="4" fill="#22d3ee" filter="url(#glowCyan)"/>
    <text x="1105" y="83" fill="#64748b" font-family="monospace" font-size="11">BUILDING</text>

    <text x="70" y="162" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="700" letter-spacing="-3">VIKRAM</text>
    <text x="74" y="194" fill="#94a3b8" font-family="monospace" font-size="15">backend · distributed systems · ai · product</text>

    <g transform="translate(72 238)" font-family="monospace" font-size="12">
      <rect width="372" height="30" rx="8" fill="#0f172a" stroke="#1e293b"/>
      <text x="14" y="20" fill="#22d3ee">$</text>
      <text x="31" y="20" fill="#cbd5e1">build systems that survive reality</text>
      <text class="typing" x="350" y="20" fill="#a78bfa">_</text>
    </g>

    <g transform="translate(72 290)" font-family="monospace" font-size="11">
      <text fill="#22d3ee">01</text><text x="26" fill="#64748b">design</text>
      <text x="98" fill="#334155">/</text>
      <text x="120" fill="#a78bfa">02</text><text x="146" fill="#64748b">build</text>
      <text x="205" fill="#334155">/</text>
      <text x="227" fill="#22d3ee">03</text><text x="253" fill="#64748b">break</text>
      <text x="314" fill="#334155">/</text>
      <text x="336" fill="#a78bfa">04</text><text x="362" fill="#64748b">understand</text>
    </g>
  </g>

  <g>
    <circle cx="890" cy="210" r="104" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="2 9"/>
    <circle cx="890" cy="210" r="72" fill="none" stroke="#475569" stroke-opacity="0.55" stroke-width="1"/>
    <circle cx="890" cy="210" r="38" fill="#22d3ee" opacity="0.08" filter="url(#glowSoft)"/>
    <circle cx="890" cy="210" r="13" fill="#0b1020" stroke="#22d3ee" stroke-width="2" filter="url(#glowCyan)"/>
    <circle cx="890" cy="210" r="4" fill="#e0f2fe"/>

    <g class="orbit">
      <circle cx="890" cy="106" r="4" fill="#22d3ee" filter="url(#glowCyan)"/>
      <circle cx="890" cy="314" r="3" fill="#a78bfa"/>
    </g>
    <g class="orbit2">
      <circle cx="962" cy="210" r="4" fill="#a78bfa" filter="url(#glowCyan)"/>
      <circle cx="818" cy="210" r="3" fill="#22d3ee"/>
    </g>

    <g filter="url(#glowCyan)">
      <circle class="pulse" cx="890" cy="106" r="3" fill="#22d3ee"/>
      <circle class="pulse pulse2" cx="962" cy="210" r="3" fill="#a78bfa"/>
      <circle class="pulse pulse3" cx="818" cy="210" r="3" fill="#22d3ee"/>
    </g>

    <g stroke="#475569" stroke-width="1" stroke-dasharray="3 7" opacity="0.6">
      <path d="M890 210L1018 146"/>
      <path d="M890 210L1040 286"/>
      <path d="M890 210L760 145"/>
    </g>

    <g class="scanner" opacity="0.6">
      <path d="M776 210H1004" stroke="#22d3ee" stroke-width="1" stroke-opacity="0.55"/>
    </g>

    <g font-family="monospace" font-size="10">
      <text x="1008" y="143" fill="#64748b">EVENTS</text>
      <text x="1032" y="300" fill="#64748b">DATA</text>
      <text x="744" y="141" fill="#64748b">AI</text>
      <text x="875" y="250" fill="#94a3b8">SYSTEM</text>
    </g>
  </g>

  <g font-family="monospace" font-size="10" fill="#475569">
    <text x="70" y="374">INDIA · 2026</text>
    <text x="1130" y="374" text-anchor="end">STATUS: BUILDING</text>
  </g>
</svg>