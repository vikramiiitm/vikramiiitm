<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="title">Vikram, Software Engineer</title>
  <desc id="desc">Vikram, a software engineer, shown as a growing tree: roots in education, a trunk of backend and distributed-systems work, and branches reaching out to where he can be reached.</desc>
  <defs>
    <linearGradient id="soil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#241B12"/>
      <stop offset="1" stop-color="#150F0A"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="26"/></filter>
    <filter id="softer" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="3"/></filter>
    <style>
      .display{font-family:Georgia,'Iowan Old Style','Times New Roman',serif}
      .sans{font-family:'Century Gothic','Avenir Next',Verdana,sans-serif}

      /* one-time growth, played once on load */
      .drawRoot,.drawTrunk,.drawBranch{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.3s ease-out forwards}
      .drawTrunk{animation-delay:.5s}
      .drawBranch{animation-delay:1.5s}
      @keyframes draw{to{stroke-dashoffset:0}}

      .fadeIn{opacity:0;animation:fadeInKF .9s ease-out forwards}
      @keyframes fadeInKF{to{opacity:1}}

      .bloom{opacity:0;transform-box:fill-box;transform-origin:center;animation:bloomKF .7s ease-out forwards}
      @keyframes bloomKF{from{opacity:0;transform:scale(.5)}to{opacity:.96;transform:scale(1)}}

      .labelFade{opacity:0;animation:fadeInKF .8s ease-out forwards}

      /* continuous, gentle, slightly different per group so it never reads as one looping mechanism */
      .treeSway{transform-box:fill-box;transform-origin:bottom center;animation:sway1 7.4s ease-in-out infinite}
      .sway2{transform-box:fill-box;transform-origin:bottom center;animation:sway2 8.6s ease-in-out infinite;animation-delay:-2.1s}
      .sway3{transform-box:fill-box;transform-origin:bottom center;animation:sway3 6.3s ease-in-out infinite;animation-delay:-3.8s}
      @keyframes sway1{0%,100%{transform:rotate(-1deg)}50%{transform:rotate(1.4deg)}}
      @keyframes sway2{0%,100%{transform:rotate(-1.6deg)}50%{transform:rotate(1.1deg)}}
      @keyframes sway3{0%,100%{transform:rotate(-.8deg)}50%{transform:rotate(2deg)}}

      .glow{animation:glowKF 4.2s ease-in-out infinite;animation-delay:3.4s}
      @keyframes glowKF{0%,100%{filter:brightness(1)}50%{filter:brightness(1.35)}}

      .firefly{filter:url(#softer);animation-iteration-count:infinite;animation-timing-function:ease-in-out}
      .f1{animation-name:drift1;animation-duration:9.5s}
      .f2{animation-name:drift2;animation-duration:12s;animation-delay:-4s}
      .f3{animation-name:drift3;animation-duration:8s;animation-delay:-2.5s}
      @keyframes drift1{0%,100%{transform:translate(0,0);opacity:.25}25%{transform:translate(14px,-18px);opacity:.6}50%{transform:translate(-6px,-6px);opacity:.3}75%{transform:translate(-16px,8px);opacity:.55}}
      @keyframes drift2{0%,100%{transform:translate(0,0);opacity:.2}30%{transform:translate(-20px,10px);opacity:.5}60%{transform:translate(10px,20px);opacity:.3}}
      @keyframes drift3{0%,100%{transform:translate(0,0);opacity:.3}40%{transform:translate(18px,14px);opacity:.55}70%{transform:translate(4px,-16px);opacity:.2}}

      @media(prefers-reduced-motion:reduce){
        *{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important}
        .drawRoot,.drawTrunk,.drawBranch{stroke-dashoffset:0}
        .bloom{opacity:.96;transform:none}
        .fadeIn,.labelFade{opacity:1}
        .firefly{opacity:.35}
      }
    </style>
  </defs>

  <rect width="1200" height="620" fill="url(#soil)"/>
  <ellipse cx="1020" cy="200" rx="260" ry="220" fill="#CE9A42" opacity=".07" filter="url(#soft)"/>
  <ellipse cx="220" cy="520" rx="240" ry="160" fill="#4C5636" opacity=".10" filter="url(#soft)"/>

  <!-- Identity, present immediately, quiet -->
  <text x="88" y="230" class="display" font-size="106" font-weight="500" letter-spacing="-1.5" fill="#F4EBDA">Vikram</text>
  <text x="92" y="306" class="sans" font-size="20" font-weight="600" fill="#F4EBDA">Software Engineer</text>
  <text x="92" y="335" class="sans" font-size="16" fill="#B7AB93">Backend &amp; distributed systems</text>

  <text x="90" y="403" class="display" font-style="italic" font-size="28" fill="#F4EBDA">Build systems that have to actually work in production.</text>
  <text x="92" y="437" class="sans" font-size="14.5" fill="#B7AB93">4+ years building event-driven backends, data pipelines and cloud infrastructure.</text>

  <!-- The tree: roots are the foundation, the trunk is the discipline, branches are how he can be reached -->
  <g class="treeSway">
    <g fill="none" stroke-linecap="round">
      <path class="drawRoot" pathLength="1" d="M1018 598 C984 581 956 578 926 589 C900 598 878 610 850 620" stroke="#38412B" stroke-width="6"/>
      <path class="drawRoot" pathLength="1" d="M1020 603 C1048 585 1072 578 1098 582 C1122 586 1143 599 1160 620" stroke="#38412B" stroke-width="6"/>
      <path class="fadeIn" style="animation-delay:.9s" d="M1009 604 C991 597 977 600 961 611" stroke="#4C5636" stroke-width="3"/>
    </g>

    <path class="drawTrunk" pathLength="1" d="M1018 620 C1012 574 1017 530 1003 488 C988 443 966 407 970 362 C974 317 1001 282 1005 240 C1009 197 998 158 976 125" fill="none" stroke="#38412B" stroke-width="15" stroke-linecap="round"/>
    <path class="fadeIn" style="animation-delay:1.1s" d="M1017 620 C1016 567 1021 526 1008 486 C994 443 976 408 979 365" fill="none" stroke="#556B4E" stroke-width="5" stroke-linecap="round" opacity=".7"/>

    <path class="drawBranch" pathLength="1" d="M1002 488 C955 458 916 441 879 405 C850 376 829 344 817 307" fill="none" stroke="#38412B" stroke-width="8" stroke-linecap="round"/>
    <path class="drawBranch" pathLength="1" d="M974 410 C1018 382 1054 355 1070 315 C1083 282 1081 247 1071 218" fill="none" stroke="#38412B" stroke-width="8" stroke-linecap="round"/>
    <path class="drawBranch" pathLength="1" d="M981 364 C944 339 918 315 902 282 C889 254 888 226 894 201" fill="none" stroke="#38412B" stroke-width="6" stroke-linecap="round"/>
    <path class="drawBranch" pathLength="1" d="M1001 287 C1031 259 1050 229 1054 193 C1057 167 1051 143 1042 121" fill="none" stroke="#38412B" stroke-width="6" stroke-linecap="round"/>
    <path class="fadeIn" style="animation-delay:2s" d="M879 405 C850 401 827 390 807 373M817 307 C794 291 778 269 773 244M1070 315 C1093 301 1107 283 1112 259M902 282 C877 270 860 253 853 232" fill="none" stroke="#4C5636" stroke-width="4" stroke-linecap="round"/>

    <g class="bloom sway2" style="animation-delay:2.2s"><path d="M805 374 C771 362 750 337 758 316 C785 310 810 332 805 374Z" fill="#6F8552"/></g>
    <g class="bloom sway3" style="animation-delay:2.35s"><path d="M775 247 C748 229 739 202 752 186 C778 188 791 214 775 247Z" fill="#8CA06B"/></g>
    <g class="bloom sway2" style="animation-delay:2.5s"><path d="M1053 194 C1026 177 1015 150 1028 134 C1054 136 1066 161 1053 194Z" fill="#8CA06B"/></g>
    <g class="bloom" style="animation-delay:2.65s"><path d="M895 203 C867 191 852 168 861 151 C886 150 902 171 895 203Z" fill="#6F8552"/></g>
    <g class="bloom sway3" style="animation-delay:2.8s"><path d="M1041 123 C1048 93 1068 74 1087 80 C1090 103 1072 121 1041 123Z" fill="#566B3E"/></g>
    <g class="bloom sway2" style="animation-delay:2.95s"><path d="M978 126 C951 111 939 88 950 73 C974 75 988 98 978 126Z" fill="#8CA06B"/></g>

    <g class="bloom" style="animation-delay:3.2s"><path d="M1110 260 C1116 227 1135 207 1156 213 C1161 237 1143 258 1110 260Z" fill="#CE9A42"/></g>
    <circle class="bloom glow" style="animation-delay:3.2s" cx="1111" cy="258" r="5" fill="#E8C46C"/>
  </g>

  <!-- Labels: roots for foundation, branches for reach -->
  <g class="display" font-style="italic" font-size="13.5" fill="#B7AB93">
    <text class="labelFade" style="animation-delay:1s" x="960" y="600">IIITM Gwalior, 2021</text>
    <text class="labelFade" style="animation-delay:2.3s" x="814" y="382">Bangalore, India</text>
    <text class="labelFade" style="animation-delay:2.7s" x="1062" y="202">
      <a xlink:href="https://linkedin.com/in/vikramchoudhry" target="_blank">in/vikramchoudhry</a>
    </text>
    <text class="labelFade" style="animation-delay:3.5s" x="1112" y="288" text-anchor="end" fill="#E8C46C">
      <a xlink:href="https://github.com/vikramiiitm" target="_blank">@vikramiiitm</a>
    </text>
  </g>

  <circle class="firefly f1" cx="880" cy="330" r="2.6" fill="#E8C46C"/>
  <circle class="firefly f2" cx="1000" cy="240" r="2.2" fill="#E8C46C"/>
  <circle class="firefly f3" cx="1120" cy="360" r="2.4" fill="#E8C46C"/>
</svg>