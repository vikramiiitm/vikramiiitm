<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#09090b"/>
      <stop offset="0.55" stop-color="#111827"/>
      <stop offset="1" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#22d3ee" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>

  <g opacity="0.18" stroke="#94a3b8" stroke-width="1">
    <path d="M0 60H1200M0 120H1200M0 180H1200M0 240H1200M0 300H1200"/>
    <path d="M100 0V360M200 0V360M300 0V360M400 0V360M500 0V360M600 0V360M700 0V360M800 0V360M900 0V360M1000 0V360M1100 0V360"/>
    <animateTransform attributeName="transform" type="translate" values="0 0;-20 10;0 0" dur="14s" repeatCount="indefinite"/>
  </g>

  <g fill="none" stroke-linecap="round">
    <path d="M90 265 C270 110 365 320 535 165 S820 70 1110 210" stroke="#22d3ee" stroke-opacity="0.32" stroke-width="2">
      <animate attributeName="stroke-opacity" values="0.18;0.5;0.18" dur="4s" repeatCount="indefinite"/>
    </path>
    <path d="M80 300 C250 185 390 260 520 120 S820 160 1120 85" stroke="#a78bfa" stroke-opacity="0.22" stroke-width="2">
      <animate attributeName="stroke-opacity" values="0.12;0.38;0.12" dur="5s" repeatCount="indefinite" begin="1s"/>
    </path>
    <path d="M120 285H1080" stroke="url(#line)" stroke-width="2" stroke-dasharray="18 22">
      <animate attributeName="stroke-dashoffset" from="0" to="-80" dur="3s" repeatCount="indefinite"/>
    </path>
  </g>

  <g filter="url(#glow)">
    <circle cx="535" cy="165" r="5" fill="#22d3ee">
      <animate attributeName="r" values="4;8;4" dur="2.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.65;1;0.65" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="820" cy="160" r="5" fill="#a78bfa">
      <animate attributeName="r" values="4;8;4" dur="3.2s" repeatCount="indefinite" begin="0.8s"/>
      <animate attributeName="opacity" values="0.55;1;0.55" dur="3.2s" repeatCount="indefinite" begin="0.8s"/>
    </circle>
  </g>

  <text x="72" y="92" fill="#64748b" font-family="monospace" font-size="15" letter-spacing="4">VIKRAMIIITM / PROFILE</text>
  <text x="72" y="166" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="700" letter-spacing="-2">VIKRAM</text>
  <text x="76" y="202" fill="#94a3b8" font-family="monospace" font-size="16">software · systems · ai · experiments</text>

  <g transform="translate(72 238)" font-family="monospace" font-size="13">
    <text fill="#22d3ee">01</text><text x="28" fill="#cbd5e1">build the thing</text>
    <text x="190" fill="#475569">→</text>
    <text x="220" fill="#a78bfa">02</text><text x="248" fill="#cbd5e1">break the abstraction</text>
    <text x="478" fill="#475569">→</text>
    <text x="508" fill="#22d3ee">03</text><text x="536" fill="#cbd5e1">understand why</text>
  </g>

  <text x="72" y="326" fill="#475569" font-family="monospace" font-size="12">STATUS: BUILDING</text>
  <text x="1128" y="326" text-anchor="end" fill="#475569" font-family="monospace" font-size="12">INDIA · 2026</text>
</svg>
