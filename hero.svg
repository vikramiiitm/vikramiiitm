<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Vikram, Software Engineer</title>
  <desc id="desc">A warm, living botanical composition introducing Vikram as a software engineer focused on backend and distributed systems.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7F3EA"/>
      <stop offset="1" stop-color="#EEE8DC"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#D8B56A" stop-opacity=".20"/>
      <stop offset="1" stop-color="#D8B56A" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&amp;family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&amp;display=swap');
      .display{font-family:'Fraunces',Georgia,serif;font-weight:600}
      .sans{font-family:'DM Sans',Arial,Helvetica,sans-serif}
      .mono{font-family:'DM Sans',Arial,Helvetica,sans-serif}
      .sway{transform-box:fill-box;transform-origin:bottom center;animation:sway 8s ease-in-out infinite}
      .sway2{animation-delay:-2.4s}
      .sway3{animation-delay:-4.8s}
      @keyframes sway{0%,100%{transform:rotate(-1deg)}50%{transform:rotate(1.5deg)}}
      @media(prefers-reduced-motion:reduce){.sway,.sway2,.sway3{animation:none}}
    </style>
  </defs>

  <rect width="1200" height="620" fill="url(#paper)"/>
  <circle cx="1000" cy="125" r="250" fill="url(#sun)" filter="url(#blur)"/>

  <g stroke="#73756D" fill="none" opacity=".23" stroke-width="1">
    <path d="M72 74h74M72 74v74"/>
    <path d="M1128 546h-74M1128 546v-74"/>
  </g>
  <circle cx="72" cy="74" r="2.5" fill="#B66A4A" opacity=".7"/>

  <text x="88" y="116" class="mono" font-size="12" font-weight="600" letter-spacing="3.5" fill="#70736A">01 / IDENTITY</text>

  <text x="86" y="284" class="display" font-size="112" letter-spacing="-3" fill="#20241E">Vikram</text>
  <path d="M91 309 C205 315 351 308 486 312" fill="none" stroke="#B66A4A" stroke-width="2.5"/>

  <text x="92" y="359" class="sans" font-size="22" font-weight="600" letter-spacing=".2" fill="#20241E">Software Engineer</text>
  <text x="92" y="389" class="sans" font-size="17" fill="#62665D">backend &amp; distributed systems</text>

  <text x="92" y="455" class="display" font-size="29" font-weight="500" fill="#294936">I build systems that have to work.</text>
  <text x="94" y="487" class="sans" font-size="15" fill="#70736A">4+ years across production systems, data, integrations and infrastructure.</text>

  <text x="92" y="538" class="mono" font-size="10.5" font-weight="600" letter-spacing="1.5" fill="#777A71">BANGALORE · IIITM GWALIOR · 2021 → NOW</text>

