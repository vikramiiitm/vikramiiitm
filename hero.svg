    <path d="M1070 315 C1093 301 1107 283 1112 259" fill="none" stroke="#4B5A46" stroke-width="4" stroke-linecap="round"/>
    <path d="M902 282 C877 270 860 253 853 232" fill="none" stroke="#4B5A46" stroke-width="3.5" stroke-linecap="round"/>

    <g class="sway2">
