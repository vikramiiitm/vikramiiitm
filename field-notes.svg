<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500"><rect width="1200" height="500" fill="#171717"/><style>.t{font:13px monospace;letter-spacing:1px;fill:#aaa}.h{font:700 38px Georgia,serif;fill:#f4f0e8}.l{stroke:#aaa;stroke-width:1;fill:none}.a{stroke:#d64b32;stroke-width:3;fill:none;stroke-dasharray:600;animation:d 4s ease-out forwards}@keyframes d{to{stroke-dashoffset:0}}</style><text x="52" y="48" class="t">FIELD GUIDE / OBSERVATIONS</text><text x="52" y="105" class="h">What tends to survive.</text><path d="M52 130H1148" class="l"/><text x="70" y="185" class="t">01</text><text x="125" y="185" class="t" fill="#f4f0e8">complexity arrives anyway</text><path d="M125 215C250 260 300 170 420 220S590 255 700 195" class="a"/><text x="70" y="295" class="t">02</text><text x="125" y="295" class="t">failure is part of the design</text><path d="M125 325C260 290 300 380 420 330S590 300 700 350" class="l"/><text x="730" y="190" class="t">WORKING PRINCIPLE</text><text x="730" y="235" class="h">Make it real.</text><text x="730" y="275" class="t">Then make it understandable.</text><text x="730" y="305" class="t">Then make it difficult to break.</text><path d="M730 350h300" class="l"/><text x="730" y="390" class="t">build / break / understand / repeat</text></svg>